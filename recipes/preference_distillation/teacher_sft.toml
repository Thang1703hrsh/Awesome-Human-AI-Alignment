method = "sft"
model = "meta-llama/Llama-3.1-8B-Instruct"
dataset = "HuggingFaceH4/ultrachat_200k"
output_dir = "models/teacher_sft"

[training]
learning_rate = 2e-5
epochs = 1.0
batch_size = 1
gradient_accumulation_steps = 16
max_length = 2048

[method_options.backend_options]
dataset_split = "train_sft"
