method = "ctpd"
model = "models/student_sft"
dataset = "data/ultrafeedback-ctpd"
output_dir = "outputs/student_ctpd"

[training]
learning_rate = 5e-7
epochs = 1.0
batch_size = 1
gradient_accumulation_steps = 32
max_length = 1024
max_prompt_length = 512
ctpd_beta = 0.5

[method_options]
reference_model = "models/teacher_dpo"
