method = "tvkd"
model = "outputs/student_dckd"
dataset = "data/ultrafeedback-dckd"
output_dir = "outputs/student_tvkd"

[training]
learning_rate = 5e-7
epochs = 5.0
batch_size = 1
gradient_accumulation_steps = 16
max_length = 2048
max_prompt_length = 512
chosen_kd_weight = 0.0001
rejected_kd_weight = 0.0001
value_function = "entropy"
value_discount = 1.0
