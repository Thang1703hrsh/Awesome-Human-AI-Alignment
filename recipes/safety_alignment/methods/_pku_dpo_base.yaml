# Shared base for the SafeDPO-paper family (DPO-Helpful / DPO-Harmless / DPO-SafeBetter / SafeDPO / BSO).
# Hyper-parameters: SafeDPO paper Table 4 ("shared by DPO and its variants"), trained with safe-rlhf's DPO code
# (log-prob convention `safe_rlhf`, Adam betas (0.9, 0.95), no-decay for bias/layernorm, grad-clip 1.0).
# Global batch: Table 4 gives 8 per device, GA 1; the GPU count is not stated -> we assume 8 GPUs = 64.
method: dpo_helpful
model:
  policy: PKU-Alignment/alpaca-7b-reproduced
  dtype: bf16
data:
  source: pku
  dataset: PKU-Alignment/PKU-SafeRLHF-30K
  train_split: train
  selection: better
  tokenization: safe_rlhf
  max_length: 512
train:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 16        # 4 x 16 = 64
  learning_rate: 1.0e-6
  lr_scheduler_type: cosine
  warmup_steps: 0.03  # fraction of total steps
  weight_decay: 0.05
  adam_beta2: 0.95
  max_grad_norm: 1.0
  param_groups: safe_rlhf
  deepspeed: recipes/safety_alignment/deepspeed/zero2_offload.json   # full FT of 7B on one H100
  seed: 42
  logging_steps: 10
method_args:
  beta: 0.1

