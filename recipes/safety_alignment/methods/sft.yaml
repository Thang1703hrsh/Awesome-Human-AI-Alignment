# SFT (safe-rlhf scripts/sft.sh). alpaca-7b-reproduced already *is* this SFT model; kept for completeness.
# Reference global batch: 4 per device x GA 8 x 8 GPUs = 256.
method: sft
model: {policy: huggyllama/llama-7b}
data: {source: alpaca, max_length: 512}
train:
  output_dir: output/sft
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 32
  learning_rate: 2.0e-5
  lr_scheduler_type: cosine
  warmup_steps: 0.03  # fraction of total steps
  weight_decay: 0.0
  adam_beta2: 0.95
  max_grad_norm: 1.0
  param_groups: safe_rlhf
  deepspeed: recipes/safety_alignment/deepspeed/zero2_offload.json

