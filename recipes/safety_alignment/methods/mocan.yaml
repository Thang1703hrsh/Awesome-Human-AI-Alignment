# MoCAN (CAN/safe_rlhf/algorithms/cdpo/dpo.py with --lamb): RM/CM relabel then TRL DPO with LoRA.
# Faithful quirks: relabeled prompts are fed WITHOUT the conversation template; LoRA target list in the repo is
# [q,k,v,out_proj,fc_in,fc_out,wte] of which only q/k/v exist in Llama. Deviation: bf16 base instead of 4-bit.
method: mocan
model:
  policy: PKU-Alignment/alpaca-7b-reproduced
  lora: {r: 8, alpha: 16, dropout: 0.05, target_modules: [q_proj, k_proj, v_proj]}
data: {dataset: PKU-Alignment/PKU-SafeRLHF-30K, holdout: 0.1, tokenization: trl, template: "{input}",
       max_length: 512, max_prompt_length: 512}
train:
  output_dir: output/can/mocan_lam0.75
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 100
  weight_decay: 0.05
  optim: adamw_torch
method_args:
  beta: 0.1
  lam: 0.75
  reward_model: PKU-Alignment/beaver-7b-v1.0-reward
  cost_model: PKU-Alignment/beaver-7b-v1.0-cost

