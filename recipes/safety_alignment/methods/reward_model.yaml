# Reward model (safe-rlhf scripts/reward-model.sh). Global batch 16 x 8 GPUs = 128.
# The released equivalent is PKU-Alignment/beaver-7b-v1.0-reward (used by default in saferlhf.yaml).
method: reward_model
model: {policy: PKU-Alignment/alpaca-7b-reproduced}
data: {dataset: PKU-Alignment/PKU-SafeRLHF, max_length: 512}
train:
  output_dir: output/reward_model
  num_train_epochs: 2
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-5
  lr_scheduler_type: cosine
  warmup_steps: 0.03  # fraction of total steps
  weight_decay: 0.1
  adam_beta2: 0.95
  max_grad_norm: 1.0
  param_groups: safe_rlhf
  deepspeed: recipes/safety_alignment/deepspeed/zero2_offload.json
method_args: {loss_type: sequence-wise, regularization: 0.001}

