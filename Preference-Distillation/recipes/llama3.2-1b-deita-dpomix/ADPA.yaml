# Model arguments
model_name_or_path: models/student_sft
torch_dtype: bfloat16

# Data training arguments
dataset_mixer:
  data/ultrafeedback_binarized-adpa: 1.0
dataset_splits:
- train
preprocessing_num_workers: 12
overwrite_output_dir: false

# Trainer arguments
bf16: true
do_eval: false
gradient_accumulation_steps: 32
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 5.0e-7
log_level: info
logging_steps: 1
lr_scheduler_type: cosine
max_length: 1024
max_prompt_length: 1800
num_train_epochs: 1
optim: adamw_torch
output_dir: models/student_adpa
per_device_train_batch_size: 1
push_to_hub: false
save_strategy: "steps"
save_steps: 100
save_only_model: true
seed: 42
warmup_ratio: 0.1
dataset_num_proc: 64
beta: 0.01

# ADPA
sft_on_chosen: 1
dpo_weight: 0
distillation_weight: 0
chosen_distil_weight: 0
rejected_distil_weight: 0
adpa_weight: 1.6
adpa_loss_type: reverse_ce
adpa_importance_sampling: false
kl_penalty_weight: 0
